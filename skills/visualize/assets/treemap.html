<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>__TITLE__</title>
    <style>
      :root {
        --ink: #212529;
        --muted: #495057;
        --line: #dee2e6;
        --paper: #ffffff;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      figure {
        margin: 0;
      }
      h1 {
        font-size: 1.4rem;
        line-height: 1.25;
        margin: 0 0 0.25rem;
      }
      .subtitle,
      .source {
        color: var(--muted);
        margin: 0;
      }
      .source {
        font-size: 0.875rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
        margin: 1rem 0 0.75rem;
      }
      nav button {
        font: inherit;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8f9fa;
        color: var(--ink);
        cursor: pointer;
      }
      nav button[aria-current="page"] {
        background: transparent;
        border-color: transparent;
        font-weight: 600;
        cursor: default;
      }
      #viz-status {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0.5rem 0;
      }
      #viz-chart {
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: __HEIGHT__px;
      }
      svg {
        display: block;
      }
      svg [data-path] {
        cursor: pointer;
      }
      svg .leaf {
        cursor: default;
      }
      svg rect:focus {
        outline: none;
        stroke: var(--ink);
        stroke-width: 3;
      }
      svg text {
        pointer-events: none;
      }
      #viz-summary {
        margin: 0.75rem 0 0.25rem;
      }
      details {
        margin-top: 1.5rem;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        margin-top: 0.75rem;
        font-variant-numeric: tabular-nums;
      }
      caption {
        text-align: left;
        color: var(--muted);
        padding-bottom: 0.5rem;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 0.35rem 0.9rem 0.35rem 0;
        text-align: left;
      }
      td.num,
      th.num {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <h1>__TITLE__</h1>
        __SUBTITLE__
        <nav id="crumbs" aria-label="Zoom path"></nav>
        <div id="viz-chart"></div>
        <p id="viz-status" role="status" hidden></p>
        <noscript><p>This chart needs JavaScript. The table below holds every value.</p></noscript>
        <figcaption>
          <p id="viz-summary">__SUMMARY__</p>
          <p class="source">
            Each box's area is its share of its parent. Click a box, or focus it and press Enter, to
            zoom in. Escape or Backspace zooms out.
          </p>
          __SOURCE__
        </figcaption>
      </figure>
      <details id="viz-table">
        <summary>Data table</summary>
        <div class="table-wrap">__TABLE__</div>
      </details>
    </main>
    <script type="application/json" id="viz-data">
      __DATA__
    </script>
    <script id="viz-layout">
      // Pure layout, no DOM: the page and the output check both call these two functions.
      var VIZ_HEADER = 44;
      var VIZ_PAD = 3;

      function vizParentKey(key) {
        var cut = key.lastIndexOf("/");
        return cut === -1 ? "." : key.slice(0, cut);
      }

      function vizName(key) {
        return key.slice(key.lastIndexOf("/") + 1);
      }

      function vizEllipsize(text, maxWidth, fontSize, measureText) {
        if (measureText(text, fontSize).width <= maxWidth) return text;
        var kept = text.length;
        while (kept > 0 && measureText(text.slice(0, kept) + "…", fontSize).width > maxWidth)
          kept -= 1;
        return text.slice(0, kept) + "…";
      }

      function vizTree(data) {
        var byKey = new Map();
        data.rows.forEach(function (row) {
          byKey.set(row.key, { row: row, children: [] });
        });
        data.rows.forEach(function (row) {
          if (row.key === ".") return;
          var parent = byKey.get(vizParentKey(row.key));
          if (parent) parent.children.push(byKey.get(row.key));
        });
        return byKey;
      }

      // The views to measure: the page's default, the whole, comes first, then each directory.
      function vizViews(data) {
        var tree = vizTree(data);
        var views = [];
        tree.forEach(function (node, key) {
          if (node.children.length > 0) views.push({ focus: key });
        });
        return views;
      }

      // Squarified treemap: Bruls, Huizing, van Wijk (2000).
      function vizSquarify(items, rect) {
        var out = [];
        var total = items.reduce(function (sum, item) {
          return sum + item.value;
        }, 0);
        if (!total || rect.w <= 0 || rect.h <= 0) return out;
        var scale = (rect.w * rect.h) / total;
        var queue = items.map(function (item) {
          return { item: item, area: item.value * scale };
        });
        var x = rect.x;
        var y = rect.y;
        var w = rect.w;
        var h = rect.h;
        function worst(row, side) {
          var sum = row.reduce(function (a, r) {
            return a + r.area;
          }, 0);
          var max = Math.max.apply(
            null,
            row.map(function (r) {
              return r.area;
            }),
          );
          var min = Math.min.apply(
            null,
            row.map(function (r) {
              return r.area;
            }),
          );
          return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
        }
        while (queue.length) {
          var side = Math.min(w, h);
          var row = [queue.shift()];
          while (queue.length && worst(row.concat([queue[0]]), side) <= worst(row, side)) {
            row.push(queue.shift());
          }
          var sum = row.reduce(function (a, r) {
            return a + r.area;
          }, 0);
          if (w >= h) {
            var columnWidth = queue.length ? sum / h : w;
            var top = y;
            row.forEach(function (r) {
              var rowHeight = r.area / columnWidth;
              out.push({ item: r.item, x: x, y: top, w: columnWidth, h: rowHeight });
              top += rowHeight;
            });
            x += columnWidth;
            w -= columnWidth;
          } else {
            var rowHeight2 = queue.length ? sum / w : h;
            var left = x;
            row.forEach(function (r) {
              var cellWidth = r.area / rowHeight2;
              out.push({ item: r.item, x: left, y: y, w: cellWidth, h: rowHeight2 });
              left += cellWidth;
            });
            y += rowHeight2;
            h -= rowHeight2;
          }
        }
        return out;
      }

      function vizTint(hex, amount) {
        var n = parseInt(hex.slice(1), 16);
        function mix(c) {
          return Math.round(c * amount + 255 * (1 - amount));
        }
        return "rgb(" + mix(n >> 16) + ", " + mix((n >> 8) & 255) + ", " + mix(n & 255) + ")";
      }

      function vizPercent(part, whole) {
        var p = (100 * part) / whole;
        return (p >= 10 || p === 0 ? p.toFixed(0) : p.toFixed(1)) + "%";
      }

      function vizItems(node) {
        return node.children
          .map(function (child) {
            return { node: child, value: child.row.value };
          })
          .filter(function (item) {
            return item.value > 0;
          })
          .sort(function (a, b) {
            return b.value - a.value;
          });
      }

      // A scene for one view: { width, height, chart, nodes, points }.
      function vizLayout(data, size, view, measureText) {
        var tree = vizTree(data);
        var focus = tree.get(view.focus);
        if (!focus || focus.children.length === 0) focus = tree.get(".");
        var unit = data.unit;
        var width = Math.max(size.width, 1);
        var height = Math.max(size.height, 1);
        var tiles = [];
        var subTiles = [];
        var labels = [];
        var points = [{ key: focus.row.key, x: width / 2, y: height / 2 }];

        function label(key, text, x, y, fontSize, maxWidth, color) {
          labels.push({
            kind: "label",
            key: key,
            path: key.slice(key.indexOf(":") + 1),
            x: x,
            y: y,
            text: vizEllipsize(text, maxWidth, fontSize, measureText),
            anchor: "start",
            baseline: "hanging",
            fontSize: fontSize,
            maxWidth: maxWidth,
            style: { fill: color },
          });
        }

        vizSquarify(vizItems(focus), { x: 0, y: 0, w: width, h: height }).forEach(
          function (tile, index) {
            var node = tile.item.node;
            var key = node.row.key;
            var directory = node.children.length > 0;
            var color = data.colors[index % data.colors.length];
            tiles.push({
              kind: "rect",
              key: "tile:" + key,
              path: key,
              directory: directory,
              x: tile.x,
              y: tile.y,
              width: tile.w,
              height: tile.h,
              style: { fill: vizTint(color, 0.22), stroke: color, strokeWidth: 2 },
            });
            points.push({ key: key, x: tile.x, y: tile.y });
            var share =
              vizPercent(node.row.value, focus.row.value) +
              " of " +
              (focus.row.key === "." ? "all" : vizName(focus.row.key) + "/");
            if (tile.w >= 40 && tile.h >= 26) {
              label(
                "name:" + key,
                vizName(key) + (directory ? "/" : ""),
                tile.x + 8,
                tile.y + 6,
                13,
                tile.w - 16,
                "#212529",
              );
            }
            if (tile.w >= 40 && tile.h >= 44) {
              label(
                "meta:" + key,
                node.row.value.toLocaleString("en") + " " + unit + " · " + share,
                tile.x + 8,
                tile.y + 24,
                11,
                tile.w - 16,
                "#495057",
              );
            }
            if (directory && tile.w > 60 && tile.h > VIZ_HEADER + 24) {
              var inner = {
                x: tile.x + VIZ_PAD,
                y: tile.y + VIZ_HEADER,
                w: tile.w - 5 - 2 * VIZ_PAD,
                h: tile.h - VIZ_HEADER - VIZ_PAD,
              };
              vizSquarify(vizItems(node), inner).forEach(function (cell) {
                var child = cell.item.node;
                var childKey = child.row.key;
                subTiles.push({
                  kind: "rect",
                  key: "tile:" + childKey,
                  path: childKey,
                  directory: child.children.length > 0,
                  x: cell.x,
                  y: cell.y,
                  width: cell.w,
                  height: cell.h,
                  style: { fill: vizTint(color, 0.42), stroke: color, strokeWidth: 1 },
                });
                points.push({ key: childKey, x: cell.x, y: cell.y });
                if (cell.w >= 46 && cell.h >= 20) {
                  label(
                    "name:" + childKey,
                    vizName(childKey) +
                      (child.children.length > 0 ? "/" : "") +
                      " " +
                      vizPercent(child.row.value, node.row.value),
                    cell.x + 4,
                    cell.y + 3,
                    11,
                    cell.w - 8,
                    "#212529",
                  );
                }
              });
            }
          },
        );

        return {
          width: width,
          height: height,
          chart: { x: 0, y: 0, width: width, height: height },
          nodes: [
            { kind: "group", key: "marks", children: tiles.concat(subTiles) },
            { kind: "group", key: "labels", children: labels },
          ],
          points: points,
        };
      }
    </script>
    <script type="module">
      const data = JSON.parse(document.getElementById("viz-data").textContent);
      const status = document.getElementById("viz-status");
      const mount = document.getElementById("viz-chart");
      const crumbs = document.getElementById("crumbs");
      const NS = "http://www.w3.org/2000/svg";
      const ariaLabel = data.spec.title;
      const estimate = (text, fontSize) => ({
        width: 0.6 * fontSize * [...text].length,
        height: 1.2 * fontSize,
      });

      const draw = (scene) => {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("width", scene.width);
        svg.setAttribute("height", scene.height);
        svg.setAttribute("role", "group");
        svg.setAttribute("aria-label", ariaLabel);
        const visit = (nodes, parent) => {
          for (const node of nodes) {
            let el;
            if (node.kind === "group") {
              el = document.createElementNS(NS, "g");
              visit(node.children, el);
            } else if (node.kind === "rect") {
              el = document.createElementNS(NS, "rect");
              el.setAttribute("x", node.x);
              el.setAttribute("y", node.y);
              el.setAttribute("width", Math.max(node.width, 0));
              el.setAttribute("height", Math.max(node.height, 0));
              el.setAttribute("fill", node.style.fill);
              el.setAttribute("stroke", node.style.stroke);
              el.setAttribute("stroke-width", node.style.strokeWidth);
              el.setAttribute("data-path", node.path);
              if (node.directory) {
                el.setAttribute("tabindex", "0");
                el.setAttribute("role", "button");
              } else {
                el.classList.add("leaf");
              }
              const title = document.createElementNS(NS, "title");
              title.textContent = node.path;
              el.append(title);
            } else if (node.kind === "label") {
              el = document.createElementNS(NS, "text");
              el.setAttribute("x", node.x);
              el.setAttribute("y", node.y);
              el.setAttribute("font-size", node.fontSize);
              el.setAttribute("dominant-baseline", "hanging");
              el.setAttribute("fill", node.style.fill);
              el.textContent = node.text;
            }
            if (el) parent.append(el);
          }
        };
        visit(scene.nodes, svg);
        return svg;
      };

      try {
        const rows = data.rows;
        const byKey = new Map(rows.map((row) => [row.key, row]));
        const parentOf = (key) => (key.includes("/") ? key.slice(0, key.lastIndexOf("/")) : ".");
        const internal = new Set(
          rows.filter((row) => row.depth > 0).map((row) => parentOf(row.key)),
        );
        const root = byKey.get(".");
        const share = (part, whole) => {
          const p = (100 * part) / whole;
          return `${p >= 10 || p === 0 ? p.toFixed(0) : p.toFixed(1)}%`;
        };
        const fromHash = () => {
          const key = decodeURIComponent(location.hash.slice(1)) || ".";
          return internal.has(key) ? key : ".";
        };
        let focus = fromHash();
        let refocus = false;

        const render = () => {
          const hash = focus === "." ? "" : `#${focus}`;
          if (location.hash !== hash) history.replaceState(null, "", hash || location.pathname);
          const width = Math.max(mount.clientWidth, 320);
          const scene = vizLayout(data, { width, height: data.height }, { focus }, estimate);
          mount.replaceChildren(draw(scene));

          const chain = [];
          for (let key = focus; ; key = parentOf(key)) {
            chain.unshift(key);
            if (key === ".") break;
          }
          crumbs.replaceChildren();
          chain.forEach((key) => {
            const button = document.createElement("button");
            button.type = "button";
            const row = byKey.get(key);
            button.textContent =
              key === "."
                ? "All"
                : `${key.slice(key.lastIndexOf("/") + 1)} ${share(row.value, root.value)}`;
            if (key === focus) button.setAttribute("aria-current", "page");
            else {
              button.addEventListener("click", () => {
                focus = key;
                render();
              });
            }
            crumbs.append(button);
          });
          const row = byKey.get(focus);
          status.hidden = false;
          status.textContent = `${focus === "." ? "All" : `${focus}/`}: ${row.value.toLocaleString("en")} ${data.unit}, ${share(row.value, root.value)} of the whole`;
          if (refocus) {
            mount.querySelector("rect[tabindex]")?.focus({ preventScroll: true });
            refocus = false;
          }
        };

        const zoom = (key) => {
          if (!internal.has(key)) return;
          focus = key;
          refocus = true;
          render();
        };

        mount.addEventListener("click", (event) => {
          const target = event.target.closest("[data-path]");
          if (target) zoom(target.getAttribute("data-path"));
        });
        mount.addEventListener("keydown", (event) => {
          const target = event.target.closest("[data-path]");
          if (target && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            zoom(target.getAttribute("data-path"));
          }
        });
        document.addEventListener("keydown", (event) => {
          if (
            (event.key === "Escape" || event.key === "Backspace") &&
            focus !== "." &&
            event.target.tagName !== "INPUT"
          ) {
            event.preventDefault();
            focus = parentOf(focus);
            render();
          }
        });
        window.addEventListener("hashchange", () => {
          focus = fromHash();
          render();
        });
        new ResizeObserver(() => render()).observe(mount);

        render();
        document.documentElement.dataset.viz = "drawn";
      } catch (error) {
        status.hidden = false;
        status.textContent = `The treemap could not be drawn: ${error.message}. The table below holds every value.`;
        document.getElementById("viz-table").open = true;
        document.documentElement.dataset.viz = "failed";
      }
    </script>
  </body>
</html>
